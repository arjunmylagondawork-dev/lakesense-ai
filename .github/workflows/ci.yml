name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.table-format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        table-format: [parquet, delta]
        exclude:
          - python-version: "3.10"
            table-format: delta
    env:
      LAKESENSE_LLM_PROVIDER: mock
      LAKESENSE_TABLE_FORMAT: ${{ matrix.table-format }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache Delta jars
        if: matrix.table-format == 'delta'
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app dags
      - name: Test
        run: pytest
      - name: End-to-end demo (full load)
        run: |
          lakesense all
          lakesense ask "top 5 customers by spend"
      - name: Incremental demo (new days, late corrections, schema drift)
        run: |
          lakesense generate --append-days 7 --drift new-column
          lakesense run
          lakesense generate --append-days 1 --drift missing-column
          lakesense run
          lakesense drift-report
          lakesense ask "customers whose segment changed most"
      - name: Delta time travel and maintenance
        if: matrix.table-format == 'delta'
        run: |
          lakesense history silver.orders
          lakesense history silver.orders --version 0
          lakesense maintain
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: reports-${{ matrix.table-format }}
          path: reports/
