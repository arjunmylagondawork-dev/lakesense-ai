version: 2

models:
  - name: fct_order_lines
    description: >
      Order-line fact. Each line is joined to the customer's SCD2 version that was
      valid when the order was placed, so segment-level reporting is historically correct.
    columns:
      - name: order_line_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: order_id
        data_type: varchar
        data_tests: [not_null]
      - name: order_date
        data_type: date
        data_tests: [not_null]
      - name: customer_id
        data_type: varchar
        data_tests: [not_null]
      - name: customer_sk
        data_type: varchar
        description: NULL when the customer record itself was quarantined (warn-level rule).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customer_history')
                field: customer_sk
      - name: customer_segment_at_order
        data_type: varchar
      - name: product_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: category
        data_type: varchar
        data_tests: [not_null]
      - name: status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [placed, shipped, delivered, cancelled, returned]
      - name: payment_method
        data_type: varchar
      - name: quantity
        data_type: integer
      - name: line_amount
        data_type: decimal(14,2)
      - name: revenue_amount
        data_type: decimal(14,2)
        data_tests: [not_null]
      - name: is_revenue
        data_type: boolean
      - name: is_returned
        data_type: boolean

  - name: dim_customer
    description: Current customer dimension (today's SCD2 version) with lifetime behaviour.
    columns:
      - name: customer_sk
        data_type: varchar
        data_tests: [unique, not_null]
      - name: customer_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: segment
        data_type: varchar
        data_tests:
          # same policy as the pipeline's `segment_valid` rule: unknown segments are
          # kept and reported (warn), not blocked
          - accepted_values:
              arguments:
                values: [consumer, smb, enterprise]
              config:
                severity: warn
      - name: country
        data_type: varchar
      - name: email
        data_type: varchar
      - name: current_since
        data_type: timestamp
      - name: attribute_changes
        data_type: bigint
      - name: lifetime_orders
        data_type: bigint
      - name: lifetime_revenue
        data_type: decimal(16,2)
      - name: first_order_date
        data_type: date
      - name: last_order_date
        data_type: date
      - name: return_rate
        data_type: double

  - name: mart_category_daily
    description: Daily revenue by category and customer segment (segment as it was at order time).
    data_tests:
      - unique_combination:
          arguments:
            columns: [order_date, category, customer_segment]
    columns:
      - name: order_date
        data_type: date
      - name: category
        data_type: varchar
      - name: customer_segment
        data_type: varchar
      - name: orders_with_category
        data_type: bigint
        description: Distinct orders containing this category. Not additive across categories.
      - name: units
        data_type: bigint
      - name: revenue
        data_type: decimal(16,2)
      - name: returned_lines
        data_type: bigint
