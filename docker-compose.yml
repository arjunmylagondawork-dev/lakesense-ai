services:
  lakesense:
    build: .
    image: lakesense-ai:latest
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      LAKESENSE_LLM_PROVIDER: ${LAKESENSE_LLM_PROVIDER:-mock}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
