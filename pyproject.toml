[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakesense-ai"
version = "0.1.0"
description = "AI-augmented PySpark + Delta Lake lakehouse: incremental medallion pipeline, SCD2, schema contracts, LLM data-quality triage, anomaly detection and guarded text-to-SQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arjun Mylagonda" }]
dependencies = [
  "pyspark>=4.0.1,<5",
  "delta-spark>=4.0,<5",        # Delta Lake for Spark (jars resolved from Maven on first run)
  "deltalake>=0.25",            # delta-rs: reads the Delta log for the serving layer
  "duckdb>=1.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "sqlglot>=25",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "altair>=5"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lakesense = "lakesense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:PySpark does not yet fully support pandas:FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
